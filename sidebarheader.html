<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Basic HTML document with CSS</title>
    <style>
        body {
            font-family: Georgia, "Times New Roman", Times, serif;
            background-color: whitesmoke;
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
        }

        p {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1em;
            text-indent: 1em;
        }

        .cube {
            width: 100px;
            height: 100px;
            color: aqua;
            background-color: blueviolet;
        }
    </style>
</head>

<body>
    <h1>Hello world</h1>
    <p>Hello !</p>
    <div class="cube">first</div>
    <div class="cube" style="background-color: red;">second</div>
</body>

</html>
