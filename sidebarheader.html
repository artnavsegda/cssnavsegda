<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Basic HTML document with CSS</title>
    <style>
        body {
            font-family: Georgia, "Times New Roman", Times, serif;
            background-color: whitesmoke;
            /*             display: flex;
            flex-direction: column; */
            margin: 0;
        }

        h1 {
            text-align: center;
        }

        p {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1em;
            text-indent: 1em;
        }

        .cube {
            width: 100px;
            height: 100px;
            color: aqua;
            background-color: blueviolet;
        }

        .wholepage {
            height: 100vh;
            display: flex;
            background-color: blueviolet;
        }

        .sidebar {
            width: 200px;
            background-color: aqua;
        }

        .headerandrest {
            display: flex;
            flex-direction: column;
            background-color: bisque;
            flex-grow: 1;
        }

        .header {
            height: 100px;
            background-color: chocolate;
        }
    </style>
</head>

<body>
    <div class="wholepage">
        <div class="sidebar">
            sidebar
        </div>
        <div class="headerandrest">
            <div class="header">header</div>
        </div>
    </div>
    </div>
</body>

</html>
