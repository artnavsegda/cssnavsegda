<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>Basic HTML document with CSS</title>
	<style>
		body {
			font-family: Georgia, "Times New Roman", Times, serif;
			background-color: whitesmoke;
		}

		h1 {
			text-align: center;
		}

		p {
			font-family: Arial, Helvetica, sans-serif;
			font-size: 1em;
			text-indent: 1em;
		}

		.example {
			color: blue;
		}

		.cube {
			width: 100px;
			height: 100px;
			color: aqua;
			background-color: blueviolet;
		}
	</style>
</head>

<body>
	<h1>Hello world</h1>
	<p>Hello <em>world</em> !</p>
	<p class="example">Hello again !</p>
	<div class="cube">first</div>
	<div class="cube" style="background-color: red;">second</div>
	<div style="position: relative; bottom: 20px">shifted</div>
	<div style="position: fixed; bottom: 10%; right: 10%;"> fixed position </div>
	<div style="position: absolute; top: 50%; left: 50%;"> absolute position </div>
	<div style="display: block;">block</div>
	<p>one</p>
	<div style="float: left;">float</div>
	<p>two</p>
	<p>three</p>
	<div class="cube"></div>
	<div class="cube"></div>
	<div class="cube"></div>
	<div class="cube"></div>
	<div class="cube"></div>
	<div class="cube"></div>
	<div class="cube"></div>
	<div class="cube"></div>
	<div class="cube"></div>
	<div class="cube"></div>
	<div class="cube"></div>
</body>

</html>
